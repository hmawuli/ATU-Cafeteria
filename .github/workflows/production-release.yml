name: ATU Cafeteria Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release label, for example 1.2.0+3"
        required: true
        type: string
      confirm:
        description: "Type RELEASE to confirm a production build"
        required: true
        type: string

jobs:
  release:
    if: ${{ inputs.confirm == 'RELEASE' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Write production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ATU_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/atu-production.jks

      - name: Build signed production APK
        env:
          ATU_REQUIRE_PROD_SIGNING: "true"
          ATU_KEYSTORE_PATH: atu-production.jks
          ATU_KEYSTORE_PASSWORD: ${{ secrets.ATU_KEYSTORE_PASSWORD }}
          ATU_KEY_ALIAS: ${{ secrets.ATU_KEY_ALIAS }}
          ATU_KEY_PASSWORD: ${{ secrets.ATU_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Remove keystore
        if: always()
        run: rm -f android/app/atu-production.jks

      - name: Publish production APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atu-cafeteria-production-${{ inputs.version }}
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
