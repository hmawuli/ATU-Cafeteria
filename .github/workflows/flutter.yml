name: ATU Cafeteria CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: atu-cafeteria-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, json, bcmath, sqlite, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate --force

      - name: PHP syntax smoke check
        run: |
          find app database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run database migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Audit PHP dependencies
        run: composer audit --no-interaction

      - name: Run Laravel tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      - name: Check PHP code style
        run: ./vendor/bin/pint --test

      - name: Check frontend↔backend API contract
        run: bash ../scripts/check_api_contract.sh

  backend-postgres:
    # PostgreSQL is the primary database (local, Docker and VPS). SQLite in
    # the `backend` job covers migrations; this job proves the whole suite on
    # the production database driver so MySQL-specific SQL cannot regress.
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atu_cafeteria_test
          POSTGRES_USER: atu
          POSTGRES_PASSWORD: atu_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atu -d atu_cafeteria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, json, bcmath, pgsql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run database migrations (PostgreSQL)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: atu_cafeteria_test
          DB_USERNAME: atu
          DB_PASSWORD: atu_secret
        run: php artisan migrate --force

      - name: Run Laravel tests (PostgreSQL)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: atu_cafeteria_test
          DB_USERNAME: atu
          DB_PASSWORD: atu_secret
        run: php artisan test

      - name: Check PHP code style
        run: ./vendor/bin/pint --test

  frontend:
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          ATU_REQUIRE_PROD_SIGNING: "false"
        run: flutter build apk --release

      - name: Build release Android App Bundle
        env:
          ATU_REQUIRE_PROD_SIGNING: "false"
        run: flutter build appbundle --release

      - name: Verify release artifacts
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload release validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: atu-cafeteria-release-validation
          path: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
