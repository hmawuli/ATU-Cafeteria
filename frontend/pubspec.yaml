name: atu_cafeteria
description: ATU Cafeteria Food Ordering & Real-Time Live Order Tracking Application
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.2.0
  intl: ^0.20.3
  image_picker: ^1.1.2
  path: ^1.9.0
  sqflite: ^2.3.3+1
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.4.0
  sqflite_common_ffi_web: ^1.0.2

# Keep the Flutter client lean on low-memory development machines.
# Removed heavy/unused UI packages. The client uses native Flutter widgets and SQLite.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/atu_splash.png
