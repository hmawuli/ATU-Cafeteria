# ATU Cafeteria — 4 GB RAM Linux profile
# preferIPv4Stack/Addresses: this machine's DNS returns IPv6-first records but
# has no IPv6 route, which makes Gradle artifact downloads fail otherwise.
# MaxMetaspaceSize 512m: release lint needs more class-metadata space than 256m.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.caching=true
# Disabled for Java 21 / Android Gradle compatibility on low-memory development machines.
org.gradle.configuration-cache=false
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
