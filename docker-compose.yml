# ATU Cafeteria — self-hosted backend stack.
#
# Stands up the Laravel REST API (PHP-FPM), Nginx and PostgreSQL with health
# checks:
#
#   cp backend/.env.example backend/.env   # then set DB_* + APP_KEY
#   docker compose up -d --build
#
# The API is then available at http://localhost:8000 (override with APP_PORT).
# See docs/DEPLOY_VPS.md for bare-metal deployment or adjust as needed.
#
# NOTE: app code ships inside the image and is copied into the `app_code`
# volume on first start. After dependency updates run `docker compose down -v`
# once so the volume is re-initialised from the rebuilt image.

name: atu-cafeteria

services:
  app:
    build:
      context: ./backend
    image: atu-cafeteria-backend:latest
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
    volumes:
      - app_code:/var/www/html
    networks:
      - atu
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    image: atu-cafeteria-backend:latest
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file: ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      MIGRATE_ON_START: "false"
      QUEUE_CONNECTION: database
    volumes:
      - app_code:/var/www/html
    networks:
      - atu
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
    image: atu-cafeteria-backend:latest
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file: ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      MIGRATE_ON_START: "false"
    volumes:
      - app_code:/var/www/html
    networks:
      - atu
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - app_code:/var/www/html:ro
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - atu
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-atu_cafeteria}
      POSTGRES_USER: ${DB_USERNAME:-atu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atu_secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - atu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-atu} -d ${DB_DATABASE:-atu_cafeteria}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_code:
  db_data:

networks:
  atu:
    driver: bridge