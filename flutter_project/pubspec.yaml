name: atu_cafeteria
description: ATU Cafeteria Food Ordering & Real-Time Live Order Tracking Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.2.0
  intl: ^0.19.0

# Keep the Flutter client lean on low-memory development machines.
# Removed unused packages: dio, shared_preferences, local_auth,
# cached_network_image, google_fonts and flutter_spinkit.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
