; ATU Cafeteria — PHP-FPM pool tuning for the Vercel container function.
;
; The stock pool allows only 5 concurrent workers per instance. Campus checkout
; bursts are short, so allow a little headroom while staying within the function
; memory budget; pm.max_requests periodically recycles workers to cap memory.
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
