# ATU Cafeteria — 4GB RAM development profile
# Keep Gradle's memory below the machine's physical RAM so Linux/VS Code stays responsive.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin: avoid a second large compiler daemon on a 4GB machine.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

# Reduce Android build overhead.
android.useAndroidX=true
android.nonTransitiveRClass=true
